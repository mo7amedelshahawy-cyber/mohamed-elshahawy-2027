            margin: 0 auto;

    const themes = [
        {id:'default',n:'Classic Blue'},
        {id:'midnight',n:'Midnight'},
        {id:'forest',n:'Forest'},
        {id:'purple',n:'Purple'},
        {id:'golden',n:'Golden'},
        {id:'contrast',n:'Contrast'}
    ];

    function cycleThemes(){
        themeIdx=(themeIdx+1)%themes.length;
        document.body.setAttribute('data-theme', themes[themeIdx].id);
        document.getElementById('themeName').innerText = themes[themeIdx].n;
    }

    function speak(text, el, callback) {
        if (!window.speechSynthesis) return;
        window.speechSynthesis.cancel();
        const ut = new SpeechSynthesisUtterance(text);
        ut.lang = vL;
        ut.rate = parseFloat(document.getElementById('speedRate').value);
        document.querySelectorAll('.word-en, .def-en').forEach(w => w.classList.remove('active-speak'));
        if(el) el.classList.add('active-speak');
        ut.onend = () => {
            if(el) el.classList.remove('active-speak');
            if(callback) callback();
        };
        ut.onerror = () => {
            if(el) el.classList.remove('active-speak');
            if(callback) callback();
        };
        window.speechSynthesis.speak(ut);
    }

    function togglePlayAll() {
        const btn = document.getElementById('playAllBtn');
        if (isPlayingAll) { stopPlayAll(); } 
        else {
            isPlayingAll = true;
            btn.innerText = "🛑 Stop";
            btn.classList.add('playing');
            playAllIndex = 0;
            playNextWord();
        }
    }

    function stopPlayAll() {
        isPlayingAll = false;
        window.speechSynthesis.cancel();
        const btn = document.getElementById('playAllBtn');
        btn.innerText = "🔊 Play All";
        btn.classList.remove('playing');
        document.querySelectorAll('.word-en, .def-en').forEach(w => w.classList.remove('active-speak'));
    }

    function playNextWord() {
        if (!isPlayingAll) return;
        const playableElements = document.querySelectorAll('.word-en, .def-en');
        if (playAllIndex < playableElements.length) {
            const el = playableElements[playAllIndex];
            el.scrollIntoView({ behavior: 'smooth', block: 'center' });
            speak(el.getAttribute('data-speak') || el.innerText, el, () => {
                playAllIndex++;
                setTimeout(playNextWord, 500);
            });
        } else { stopPlayAll(); }
    }

    function initNav(){
        const nav = document.getElementById('unitNav');
        nav.innerHTML = '';
        Object.keys(data).forEach(u => {
            const btn = document.createElement('button');
            btn.className = `unit-btn ${u===currU?'active':''}`;
            btn.innerText = `Unit ${u.replace('u','')}`;
            btn.onclick = () => {
                currU = u;
                document.querySelectorAll('.unit-btn').forEach(b=>b.classList.remove('active'));
                btn.classList.add('active');
                render();
            };
            nav.appendChild(btn);
        });
    }

    function setL(l, el){
        currL = l;
        document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
        el.classList.add('active');
        render();
    }

    function render(){
        const container = document.getElementById('dictionaryContent');
        container.innerHTML = '';
        const query = document.getElementById('search').value.toLowerCase().trim();

        let unitsToSearch = query ? Object.keys(data) : [currU];

        unitsToSearch.forEach(uKey => {
            let lessonsToSearch = (currL === 'all' || query) ? ['12', '45'] : [currL];
            
            lessonsToSearch.forEach(lKey => {
                const categories = data[uKey][lKey];
                if(!categories) return;

                Object.keys(categories).forEach(catName => {
                    const items = categories[catName];
                    const filtered = items.filter(i => {
                        const enMatch = i.en && i.en.toLowerCase().includes(query);
                        const arMatch = i.ar && i.ar.includes(query);
                        const defEnMatch = i.defEn && i.defEn.toLowerCase().includes(query);
                        const defArMatch = i.defAr && i.defAr.includes(query);
                        return enMatch || arMatch || defEnMatch || defArMatch;
                    });

                    if(filtered.length > 0){
                        const header = document.createElement('div');
                        header.className = 'section-header';
                        let displayTitle = catName;
                        if(query || currL === 'all') {
                            displayTitle = `Unit ${uKey.replace('u','')} - L${lKey === '12' ? '1&2' : '4&5'} : ${catName}`;
                        }
                        header.innerHTML = `<span class="section-title">${displayTitle}</span><span class="word-count">${filtered.length}</span>`;
                        container.appendChild(header);

                        const card = document.createElement('div');
                        card.className = 'content-card';
                        let tableHtml = '<table>';

                        filtered.forEach(item => {
                            tableHtml += '<tr><td>';
                            if(item.defEn){
                                tableHtml += `<span class="word-en" onclick="speak('${item.en.replace(/'/g, "\\'")}', this)">${item.en}</span>`;
                                if(item.t) tableHtml += `<span class="word-type">(${item.t})</span>`;
                                tableHtml += `<span class="def-en" onclick="speak('${item.defEn.replace(/'/g, "\\'")}', this)">${item.defEn}</span>`;
                                tableHtml += `<div class="word-ar">${item.ar}</div>`;
                                if(item.exp) tableHtml += `<div class="exp-ar">${item.exp}</div>`;
                            } else {
                                tableHtml += `<span class="word-en" onclick="speak('${item.en.replace(/'/g, "\\'")}', this)">${item.en}</span>`;
                                if(item.t) tableHtml += `<span class="word-type">(${item.t})</span>`;
                                tableHtml += `<div class="word-ar">${item.ar}</div>`;
                            }
                            tableHtml += '</td></tr>';
                        });

                        tableHtml += '</table>';
                        card.innerHTML = tableHtml;
                        container.appendChild(card);
                    }
                });
            });
        });

        if(container.innerHTML === ''){
            container.innerHTML = '<div style="text-align:center; padding:40px; color:var(--text); opacity:0.6;">لا توجد نتائج لعرضها</div>';
        }
    }

    initNav();
    render();
