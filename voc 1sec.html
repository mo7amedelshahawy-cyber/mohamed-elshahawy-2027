        {id:'midnight',n:'Midnight'},

        {id:'purple',n:'Purple'},
        {id:'golden',n:'Golden'},
        {id:'contrast',n:'Contrast'}
    ];

    function cycleThemes(){
        themeIdx=(themeIdx+1)%themes.length;
        document.body.setAttribute('data-theme', themes[themeIdx].id);
        document.getElementById('themeName').innerText = themes[themeIdx].n;
    }

    function speak(text, el, callback) {
        if (!window.speechSynthesis) return;
        window.speechSynthesis.cancel();
        const ut = new SpeechSynthesisUtterance(text);
        ut.lang = vL;
        ut.rate = parseFloat(document.getElementById('speedRate').value);
        document.querySelectorAll('.word-en').forEach(w => w.classList.remove('active-speak'));
        if(el) el.classList.add('active-speak');
        ut.onend = () => {
            if(el) el.classList.remove('active-speak');
            if(callback) callback();
        };
        window.speechSynthesis.speak(ut);
    }

    function togglePlayAll() {
        const btn = document.getElementById('playAllBtn');
        if (isPlayingAll) { stopPlayAll(); } 
        else {
            isPlayingAll = true;
            btn.innerText = "🛑 Stop";
            btn.classList.add('playing');
            playAllIndex = 0;
            playNextWord();
        }
    }

    function stopPlayAll() {
        isPlayingAll = false;
        window.speechSynthesis.cancel();
        const btn = document.getElementById('playAllBtn');
        btn.innerText = "🔊 Play All";
        btn.classList.remove('playing');
        document.querySelectorAll('.word-en').forEach(w => w.classList.remove('active-speak'));
    }

    function playNextWord() {
        if (!isPlayingAll) return;
        const words = document.querySelectorAll('.word-en');
        if (playAllIndex < words.length) {
            const wordEl = words[playAllIndex];
            wordEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
            speak(wordEl.innerText, wordEl, () => {
                playAllIndex++;
                setTimeout(playNextWord, 600);
            });
        } else { stopPlayAll(); }
    }

    function renderUnits() {
        const nav = document.getElementById('unitNav'); nav.innerHTML = '';
        Object.keys(data).forEach(u => {
            const btn = document.createElement('button');
            btn.className = `unit-btn ${currU === u ? 'active' : ''}`;
            btn.innerText = "Unit " + u.replace('u','');
            btn.onclick = () => { stopPlayAll(); currU = u; renderUnits(); resetL(); render(); };
            nav.appendChild(btn);
        });
    }

    function resetL() {
        currL = '12';
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.getElementById('tab12').classList.add('active');
    }

    function setL(l, el) { 
        stopPlayAll(); 
        currL = l; 
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active')); 
        el.classList.add('active'); 
        render(); 
    }

    function render() {
        const q = document.getElementById('search').value.toLowerCase();
        const container = document.getElementById('dictionaryContent');
        container.innerHTML = "";
        
        let target = {};
        if (!data[currU]) return;

        if(currL === 'all') {
            const uData = data[currU];
            target = { "All Unit Vocabulary": [] };
            ["12", "34"].forEach(lKey => {
                if(uData[lKey]) {
                    Object.keys(uData[lKey]).forEach(secKey => {
                        target["All Unit Vocabulary"].push(...uData[lKey][secKey]);
                    });
                }
            });
        } else {
            target = data[currU][currL] || {};
        }

        Object.keys(target).forEach(section => {
            const filtered = target[section].filter(i => i.en.toLowerCase().includes(q) || i.ar.includes(q));
            if (filtered.length > 0) {
                let html = `<div class="section-header"><span class="section-title">${section}</span><span class="word-count">${filtered.length}</span></div>`;
                html += `<div class="content-card"><table>`;
                filtered.forEach(i => { 
                    const typeLabel = i.t ? `<span class="word-type">(${i.t})</span>` : '';
                    html += `<tr><td><span class="word-en" onclick="speak('${i.en.replace(/'/g, "\\'")}', this)">${i.en} ${typeLabel}</span></td><td><span class="word-ar">${i.ar}</span></td></tr>`; 
                });
                html += `</table></div>`;
                container.innerHTML += html;
            }
        });
    }
    window.onload = () => { renderUnits(); render(); };
