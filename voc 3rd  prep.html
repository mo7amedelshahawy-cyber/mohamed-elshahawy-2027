    const themes = [
        {id:'default',n:'Classic Blue'},
        {id:'midnight',n:'Midnight'},
        {id:'forest',n:'Forest'},
        {id:'purple',n:'Purple'},
        {id:'golden',n:'Golden'},
        {id:'contrast',n:'Contrast'}
    ];

    function cycleThemes(){
        themeIdx=(themeIdx+1)%themes.length;
        document.body.setAttribute('data-theme', themes[themeIdx].id);
        document.getElementById('themeName').innerText = themes[themeIdx].n;
    }

    function speak(text, el, callback) {
        if (!window.speechSynthesis) return;
        window.speechSynthesis.cancel();
        const ut = new SpeechSynthesisUtterance(text);
        ut.lang = vL;
        ut.rate = parseFloat(document.getElementById('speedRate').value);
        document.querySelectorAll('.word-en, .def-box').forEach(w => w.classList.remove('active-speak'));
        if(el) el.classList.add('active-speak');
        ut.onend = () => {
            if(el) el.classList.remove('active-speak');
            if(callback) callback();
        };
        window.speechSynthesis.speak(ut);
    }

    function togglePlayAll() {
        const btn = document.getElementById('playAllBtn');
        if (isPlayingAll) { stopPlayAll(); } 
        else {
            isPlayingAll = true;
            btn.innerText = "🛑 Stop";
            btn.classList.add('playing');
            playAllIndex = 0;
            playNextWord();
        }
    }

    function stopPlayAll() {
        isPlayingAll = false;
        window.speechSynthesis.cancel();
        const btn = document.getElementById('playAllBtn');
        btn.innerText = "🔊 Play All";
        btn.classList.remove('playing');
        document.querySelectorAll('.word-en, .def-box').forEach(w => w.classList.remove('active-speak'));
    }

    function playNextWord() {
        if (!isPlayingAll) return;
        const words = document.querySelectorAll('.word-en');
        if (playAllIndex < words.length) {
            const wordEl = words[playAllIndex];
            wordEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
            speak(wordEl.innerText, wordEl, () => {
                playAllIndex++;
                setTimeout(playNextWord, 600);
            });
        } else { stopPlayAll(); }
    }

    function initNav() {
        const nav = document.getElementById('unitNav');
        nav.innerHTML = '';
        for (let i = 1; i <= 6; i++) {
            const btn = document.createElement('button');
            btn.className = `unit-btn ${currU === 'u' + i ? 'active' : ''}`;
            btn.innerText = `Unit ${i}`;
            btn.onclick = () => setU('u' + i, btn);
            nav.appendChild(btn);
        }
    }

    function setU(u, btn) {
        currU = u;
        document.querySelectorAll('.unit-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        stopPlayAll();
        render();
    }

    function setL(l, tab) {
        currL = l;
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        stopPlayAll();
        render();
    }

    function render() {
        const container = document.getElementById('dictionaryContent');
        const q = document.getElementById('search').value.toLowerCase().trim();
        container.innerHTML = '';

        let targetData = {};

        if (currL === 'all') {
            const uObj = data[currU] || {};
            for (let lKey in uObj) {
                for (let sec in uObj[lKey]) {
                    if (!targetData[sec]) targetData[sec] = [];
                    targetData[sec] = targetData[sec].concat(uObj[lKey][sec]);
                }
            }
        } else {
            targetData = (data[currU] && data[currU][currL]) ? data[currU][currL] : {};
        }

        let totalRendered = 0;

        for (let sec in targetData) {
            let words = targetData[sec] || [];
            if (q) {
                words = words.filter(w => 
                    w.en.toLowerCase().includes(q) || 
                    w.ar.includes(q) || 
                    (w.def && w.def.toLowerCase().includes(q))
                );
            }

            if (words.length > 0) {
                totalRendered += words.length;

                const secHeader = document.createElement('div');
                secHeader.className = 'section-header';
                secHeader.innerHTML = `
                    <span class="section-title">${sec}</span>
                    <span class="word-count">${words.length} items</span>
                `;
                container.appendChild(secHeader);

                const card = document.createElement('div');
                card.className = 'content-card';
                let tableHtml = '<table>';

                words.forEach(w => {
                    const typeHtml = w.t ? `<span class="word-type">(${w.t})</span>` : '';
                    
                    let defHtml = '';
                    if (w.def) {
                        defHtml = `
                            <span class="def-box" onclick="event.stopPropagation(); speak('${w.def.replace(/'/g, "\\'")}', this)">
                                <span class="def-label">📖 Definition (Click to listen):</span>
                                ${w.def}
                            </span>
                        `;
                    }

                    tableHtml += `
                        <tr>
                            <td>
                                <span class="word-en" onclick="speak('${w.en.replace(/'/g, "\\'")}', this)">${w.en}</span>
                                ${typeHtml}
                                ${defHtml}
                            </td>
                            <td class="word-ar">${w.ar}</td>
                        </tr>
                    `;
                });

                tableHtml += '</table>';
                card.innerHTML = tableHtml;
                container.appendChild(card);
            }
        }

        if (totalRendered === 0) {
            container.innerHTML = `<div style="text-align:center; padding: 40px; color: var(--text); opacity:0.6;">لا توجد كلمات للعرض حالياً</div>`;
        }
    }

    window.onload = () => {
        initNav();
        render();
    };
