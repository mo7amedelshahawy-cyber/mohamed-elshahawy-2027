        {id:'contrast',n:'Contrast'}

    function cycleThemes(){
        themeIdx=(themeIdx+1)%themes.length;
        document.body.setAttribute('data-theme', themes[themeIdx].id);
        document.getElementById('themeName').innerText = themes[themeIdx].n;
    }

    function speak(text, el, callback) {
        if (!window.speechSynthesis) return;
        window.speechSynthesis.cancel();
        const ut = new SpeechSynthesisUtterance(text);
        ut.lang = vL;
        ut.rate = parseFloat(document.getElementById('speedRate').value);
        document.querySelectorAll('.word-en').forEach(w => w.classList.remove('active-speak'));
        if(el) el.classList.add('active-speak');
        ut.onend = () => {
            if(el) el.classList.remove('active-speak');
            if(callback) callback();
        };
        window.speechSynthesis.speak(ut);
    }

    function togglePlayAll() {
        const btn = document.getElementById('playAllBtn');
        if (isPlayingAll) { stopPlayAll(); } 
        else {
            isPlayingAll = true;
            btn.innerText = "🛑 Stop";
            btn.classList.add('playing');
            playAllIndex = 0;
            playNextWord();
        }
    }

    function stopPlayAll() {
        isPlayingAll = false;
        window.speechSynthesis.cancel();
        const btn = document.getElementById('playAllBtn');
        btn.innerText = "🔊 Play All";
        btn.classList.remove('playing');
        document.querySelectorAll('.word-en').forEach(w => w.classList.remove('active-speak'));
    }

    function playNextWord() {
        if (!isPlayingAll) return;
        const words = document.querySelectorAll('.word-en');
        if (playAllIndex < words.length) {
            const wordEl = words[playAllIndex];
            wordEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
            speak(wordEl.innerText, wordEl, () => {
                playAllIndex++;
                setTimeout(playNextWord, 600);
            });
        } else { stopPlayAll(); }
    }

                "Verbal Collocations": [
                    {en:"achieve goals", ar:"يُحَقِّق الأَهْدَاف"},
                    {en:"face challenges", ar:"يُوَاجِه التَّحَدِّيَات"},
                    {en:"overcome obstacles", ar:"يَتَغَلَّب عَلَى العَقَبَات"},
                    {en:"set an example", ar:"يَكُون قُدْوَة"}
                ],
                "Expressions & Idioms": [
                    {en:"against all odds", ar:"رَغْمَ كُلِّ الظُّرُوف"},
                    {en:"reach for the stars", ar:"يَسْعَى لِلْمَجْد"}
                ],
                "Verb + Preposition": [
                    {en:"aim for", ar:"يَهْدِف إِلَى", t:"prep"},
                    {en:"believe in", ar:"يُؤْمِن بـ", t:"prep"},
                    {en:"strive for", ar:"يَسْعَى جَاهِدًا لِـ", t:"prep"}
                ]
            }
        }
    };

    function buildUnitNav() {
        const nav = document.getElementById('unitNav');
        nav.innerHTML = '';
        Object.keys(data).forEach((u, index) => {
            const btn = document.createElement('button');
            btn.className = `unit-btn ${u === currU ? 'active' : ''}`;
            btn.innerText = `Unit ${u.replace('u', '')}`;
            btn.onclick = () => setU(u, btn);
            nav.appendChild(btn);
        });
    }

    function setU(u, btn) {
        currU = u;
        document.querySelectorAll('.unit-btn').forEach(b => b.classList.remove('active'));
        if(btn) btn.classList.add('active');
        render();
    }

    function setL(l, tab) {
        currL = l;
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        if(tab) tab.classList.add('active');
        render();
    }

    function render() {
        stopPlayAll();
        const container = document.getElementById('dictionaryContent');
        const searchVal = document.getElementById('search').value.toLowerCase().trim();
        container.innerHTML = '';

        let lessonsToRender = [];
        if (currL === 'all') {
            lessonsToRender = ['12', '45'];
        } else {
            lessonsToRender = [currL];
        }

        let combinedSections = {};

        lessonsToRender.forEach(lKey => {
            const lData = data[currU] ? data[currU][lKey] : null;
            if (lData) {
                Object.keys(lData).forEach(secTitle => {
                    if (!combinedSections[secTitle]) {
                        combinedSections[secTitle] = [];
                    }
                    combinedSections[secTitle] = combinedSections[secTitle].concat(lData[secTitle]);
                });
            }
        });

        let totalWords = 0;

        Object.keys(combinedSections).forEach(secTitle => {
            const words = combinedSections[secTitle].filter(item => {
                const enMatch = item.en && item.en.toLowerCase().includes(searchVal);
                const arMatch = item.ar && item.ar.includes(searchVal);
                return enMatch || arMatch;
            });

            if (words.length > 0) {
                totalWords += words.length;

                const secHeader = document.createElement('div');
                secHeader.className = 'section-header';
                secHeader.innerHTML = `
                    <div class="section-title">${secTitle}</div>
                    <div class="word-count">${words.length} Words</div>
                `;
                container.appendChild(secHeader);

                const card = document.createElement('div');
                card.className = 'content-card';

                const table = document.createElement('table');
                words.forEach(w => {
                    const tr = document.createElement('tr');
                    
                    const tdEn = document.createElement('td');
                    tdEn.style.textAlign = 'left';
                    tdEn.style.width = '50%';
                    
                    let typeSpan = w.t ? `<span class="word-type">(${w.t})</span>` : '';
                    tdEn.innerHTML = `<span class="word-en" onclick="speak('${w.en.replace(/'/g, "\\'")}', this)">${w.en}</span> ${typeSpan}`;

                    const tdAr = document.createElement('td');
                    tdAr.style.textAlign = 'right';
                    tdAr.style.width = '50%';
                    tdAr.innerHTML = `<span class="word-ar">${w.ar}</span>`;

                    tr.appendChild(tdEn);
                    tr.appendChild(tdAr);
                    table.appendChild(tr);
                });

                card.appendChild(table);
                container.appendChild(card);
            }
        });

        if (totalWords === 0) {
            container.innerHTML = `<div style="text-align:center; padding: 40px; color: var(--text); opacity: 0.7;">No matching words found / لا توجد نتائج مطابقة</div>`;
        }
    }

    window.onload = () => {
        buildUnitNav();
        render();
    };
</script>
</body>
</html>
